<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Solar System — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --accent:#5eead4; --text:#e8ecf5; --muted:#93a0b8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { background:#02030a; color:var(--text); font-family:"Inter",system-ui,sans-serif; overflow:hidden; }
    #scene { display:block; width:100vw; height:100vh; cursor:grab; }
    #scene:active { cursor:grabbing; }

    .overlay { position:fixed; z-index:10; pointer-events:none; }
    .top-left { top:24px; left:28px; }
    .top-left h1 { font-family:"Space Grotesk",sans-serif; font-size:1.15rem; letter-spacing:.5px; }
    .top-left h1 span { color:var(--accent); }
    .top-left p { color:var(--muted); font-size:.85rem; margin-top:4px; max-width:280px; }

    .legend { bottom:24px; left:28px; display:flex; flex-direction:column; gap:8px; }
    .legend button {
      pointer-events:auto; cursor:pointer; text-align:left;
      display:flex; align-items:center; gap:10px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
      color:var(--text); padding:7px 13px; border-radius:10px; font-size:.82rem;
      font-family:inherit; transition:border-color .2s, background .2s;
    }
    .legend button:hover { border-color:var(--accent); background:rgba(94,234,212,.08); }
    .legend .dot { width:11px; height:11px; border-radius:50%; box-shadow:0 0 8px currentColor; }

    .controls { top:24px; right:28px; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
    .controls button {
      pointer-events:auto; cursor:pointer;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
      color:var(--text); padding:8px 15px; border-radius:10px; font-size:.82rem;
      font-family:inherit; transition:border-color .2s, background .2s;
    }
    .controls button:hover { border-color:var(--accent); }

    #label {
      position:fixed; z-index:11; pointer-events:none; transform:translate(-50%,-140%);
      background:rgba(5,7,13,.85); border:1px solid rgba(94,234,212,.5);
      padding:5px 11px; border-radius:8px; font-size:.8rem; white-space:nowrap;
      opacity:0; transition:opacity .15s; backdrop-filter:blur(4px);
    }
    .hint { bottom:24px; right:28px; color:var(--muted); font-size:.78rem; text-align:right; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="overlay top-left">
    <h1>Solar<span>.</span>System</h1>
    <p>Drag to orbit · scroll to zoom · click a planet to focus.</p>
  </div>

  <div class="overlay controls">
    <button id="toggle-orbits">Hide orbits</button>
    <button id="toggle-motion">Pause</button>
    <button id="reset-view">Reset view</button>
  </div>

  <div class="overlay legend" id="legend"></div>
  <div class="overlay hint">Not to scale — sizes &amp; distances stylized for looks.</div>
  <div id="label"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const canvas = document.getElementById("scene");
    const labelEl = document.getElementById("label");
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
    const HOME = new THREE.Vector3(0, 55, 90);
    camera.position.copy(HOME);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 12;
    controls.maxDistance = 400;

    // ---------- Starfield (surrounds the scene on a big shell) ----------
    const starTints = [ [1,1,1], [0.75,0.83,1], [1,0.9,0.75], [0.9,0.95,1] ];
    function makeStars(count, size, minB, maxB){
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count*3), col = new Float32Array(count*3);
      for (let i=0;i<count;i++){
        const r = 700 + Math.random()*450;
        const th = Math.random()*Math.PI*2;
        const ph = Math.acos(2*Math.random()-1);
        pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
        pos[i*3+1] = r*Math.cos(ph);
        pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
        const tint = starTints[(Math.random()*starTints.length)|0];
        const b = minB + Math.random()*(maxB-minB);
        col[i*3]=tint[0]*b; col[i*3+1]=tint[1]*b; col[i*3+2]=tint[2]*b;
      }
      geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
      geo.setAttribute("color", new THREE.BufferAttribute(col,3));
      const mat = new THREE.PointsMaterial({ vertexColors:true, size, sizeAttenuation:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
      return new THREE.Points(geo, mat);
    }
    const starField = new THREE.Group();
    starField.add(makeStars(4000, 1.6, 0.4, 0.8));  // dim, plentiful
    starField.add(makeStars(700, 3.0, 0.7, 1.0));   // medium
    starField.add(makeStars(90,  5.5, 0.9, 1.0));   // bright hero stars
    scene.add(starField);

    // ---------- Sun (multi-layer glow, drives bloom) ----------
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(6, 64, 64),
      new THREE.MeshBasicMaterial({ color:0xffd24a })
    );
    scene.add(sun);

    // Emissive surface shimmer via a slightly larger additive shell
    const sunSkin = new THREE.Mesh(
      new THREE.SphereGeometry(6.25, 64, 64),
      new THREE.MeshBasicMaterial({ color:0xff8a1e, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending })
    );
    scene.add(sunSkin);

    // Soft corona halos (billboarded, additive) for a bright modern glow
    function makeHalo(radius, color, opacity) {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      const g = c.getContext("2d");
      const grd = g.createRadialGradient(128,128,0, 128,128,128);
      grd.addColorStop(0, color); grd.addColorStop(0.4, color);
      grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd; g.fillRect(0,0,256,256);
      const tex = new THREE.CanvasTexture(c);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false }));
      spr.scale.set(radius, radius, 1);
      return spr;
    }
    sun.add(makeHalo(34, "rgba(255,160,40,0.9)", 0.8));
    sun.add(makeHalo(22, "rgba(255,210,90,0.95)", 0.9));

    const sunLight = new THREE.PointLight(0xfff2cc, 4.0, 0, 0.18);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x2a2e45, 0.9));

    // ---------- Planets (vibrant, emissive, atmosphere halos) ----------
    const PLANETS = [
      { name:"Mercury", type:"rocky", emissive:0x1a1410, size:0.9,  dist:14, speed:1.6,  spin:0.02 },
      { name:"Venus",   type:"gas",   emissive:0x2a1500, size:1.5,  dist:20, speed:1.17, spin:0.015, bandCount:5 },
      { name:"Earth",   type:"earth", emissive:0x04202f, size:1.7,  dist:27, speed:1.0,  spin:0.03,  moon:true, atmo:0x4fc3ff },
      { name:"Mars",    type:"rocky", emissive:0x200800, size:1.2,  dist:34, speed:0.8,  spin:0.028, atmo:0xff7a4d },
      { name:"Jupiter", type:"gas",   emissive:0x1c1006, size:3.6,  dist:48, speed:0.45, spin:0.05,  atmo:0xffc98a, bandCount:11 },
      { name:"Saturn",  type:"gas",   emissive:0x1c1405, size:3.0,  dist:62, speed:0.32, spin:0.045, ring:true, bandCount:8 },
      { name:"Uranus",  type:"ice",   emissive:0x06282a, size:2.2,  dist:74, speed:0.22, spin:0.03,  atmo:0x8ffff2 },
      { name:"Neptune", type:"ice",   emissive:0x05103a, size:2.1,  dist:84, speed:0.18, spin:0.032, atmo:0x6f9bff },
    ];

    // ---------- Procedural planet surface textures (no asset files) ----------
    const lerp = (a,b,t) => a + (b-a)*t;
    function hashSeed(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
    function valueNoise2D(seed){
      const r = mulberry32(seed), gs = 256, grid = new Float32Array(gs*gs);
      for (let i=0;i<grid.length;i++) grid[i] = r();
      const at = (x,y) => {
        const xi=Math.floor(x)&(gs-1), yi=Math.floor(y)&(gs-1);
        const xf=x-Math.floor(x), yf=y-Math.floor(y);
        const x1=(xi+1)&(gs-1), y1=(yi+1)&(gs-1);
        const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
        const v00=grid[yi*gs+xi], v10=grid[yi*gs+x1], v01=grid[y1*gs+xi], v11=grid[y1*gs+x1];
        return (v00*(1-u)+v10*u)*(1-v)+(v01*(1-u)+v11*u)*v;
      };
      return (x,y,oct=5) => { let a=0,amp=0.5,f=1,tot=0; for(let o=0;o<oct;o++){ a+=amp*at(x*f,y*f); tot+=amp; f*=2; amp*=0.5; } return a/tot; };
    }
    function palAt(pal, t){
      t = Math.max(0, Math.min(1, t));
      const s = t*(pal.length-1), i = Math.floor(s), f = s-i;
      const a = pal[i], b = pal[Math.min(i+1, pal.length-1)];
      return [lerp(a[0],b[0],f), lerp(a[1],b[1],f), lerp(a[2],b[2],f)];
    }
    const PALETTES = {
      Mercury: [[55,50,46],[110,100,90],[165,150,135],[205,195,180]],
      Mars:    [[70,24,12],[140,50,28],[195,85,52],[228,140,100]],
      Venus:   [[110,55,10],[185,110,35],[228,168,82],[248,222,158]],
      Jupiter: [[120,80,55],[186,138,96],[224,190,150],[242,220,190],[160,104,74]],
      Saturn:  [[150,120,72],[200,172,112],[230,206,152],[246,230,190]],
      Uranus:  [[80,175,185],[140,215,222],[188,238,240]],
      Neptune: [[26,46,135],[42,80,190],[86,128,228],[150,182,246]],
      Earth:   [[20,70,140],[40,110,170],[60,150,90]],
    };
    function makePlanetTexture(p){
      const W=512, H=256;
      const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
      const ctx=cv.getContext("2d"), img=ctx.createImageData(W,H), d=img.data;
      const bcv=document.createElement("canvas"); bcv.width=W; bcv.height=H;
      const bctx=bcv.getContext("2d"), bimg=bctx.createImageData(W,H), bd=bimg.data;
      const fbm=valueNoise2D(hashSeed(p.name));
      const pal=PALETTES[p.name];
      for (let y=0;y<H;y++){
        const lat=y/H;
        const polar=Math.pow(Math.abs(lat-0.5)*2, 3);
        for (let x=0;x<W;x++){
          const u=x/W; let r,g,b,elev;
          if (p.type==="gas"){
            const warp=fbm(u*6, lat*3, 4)*0.9;
            const bands=0.5+0.5*Math.sin(lat*(p.bandCount||9)*Math.PI*2 + warp*6);
            const n=fbm(u*5, lat*14, 5);
            elev=bands*0.7 + n*0.3;
            [r,g,b]=palAt(pal, elev);
          } else if (p.type==="ice"){
            const n=fbm(u*3, lat*4, 4);
            const bands=0.5+0.5*Math.sin(lat*Math.PI*7 + n*3);
            elev=n*0.65 + bands*0.35;
            [r,g,b]=palAt(pal, elev);
          } else if (p.type==="earth"){
            const n=fbm(u*5, lat*5, 6); elev=n;
            if (n<0.5){ [r,g,b]=palAt([[8,26,72],[18,64,124],[38,108,166]], n/0.5); }
            else { [r,g,b]=palAt([[30,86,42],[74,120,50],[128,116,60],[110,86,58]], (n-0.5)/0.5); }
            if (polar>0.55){ const w=(polar-0.55)/0.45; r=lerp(r,238,w); g=lerp(g,244,w); b=lerp(b,250,w); }
          } else { // rocky
            const n=fbm(u*6, lat*6, 6), cr=fbm(u*18+40, lat*18+40, 3);
            elev=n*0.78 + cr*0.22;
            [r,g,b]=palAt(pal, elev);
          }
          const idx=(y*W+x)*4;
          d[idx]=r; d[idx+1]=g; d[idx+2]=b; d[idx+3]=255;
          const bv=elev*255|0; bd[idx]=bv; bd[idx+1]=bv; bd[idx+2]=bv; bd[idx+3]=255;
        }
      }
      ctx.putImageData(img,0,0); bctx.putImageData(bimg,0,0);
      const map=new THREE.CanvasTexture(cv); map.colorSpace=THREE.SRGBColorSpace; map.anisotropy=4;
      const bump=new THREE.CanvasTexture(bcv);
      return { map, bump };
    }

    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);
    const planetMeshes = [];

    PLANETS.forEach((p) => {
      const pivot = new THREE.Group();
      scene.add(pivot);

      const tex = makePlanetTexture(p);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.size, 64, 64),
        new THREE.MeshStandardMaterial({ map:tex.map, bumpMap:tex.bump, bumpScale:0.06, emissive:p.emissive, emissiveIntensity:0.14, roughness:0.9, metalness:0.05 })
      );
      mesh.position.x = p.dist;
      mesh.userData = p;
      pivot.add(mesh);
      planetMeshes.push(mesh);

      // Atmosphere halo (backside additive shell)
      if (p.atmo) {
        const atmo = new THREE.Mesh(
          new THREE.SphereGeometry(p.size*1.22, 48, 48),
          new THREE.MeshBasicMaterial({ color:p.atmo, transparent:true, opacity:0.22, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false })
        );
        mesh.add(atmo);
      }

      if (p.ring) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(p.size*1.4, p.size*2.3, 96),
          new THREE.MeshBasicMaterial({ color:0xffe6b0, side:THREE.DoubleSide, transparent:true, opacity:0.75, blending:THREE.AdditiveBlending })
        );
        ring.rotation.x = Math.PI/2.2;
        mesh.add(ring);
      }
      if (p.moon) {
        const moonPivot = new THREE.Group();
        const moon = new THREE.Mesh(
          new THREE.SphereGeometry(0.45, 24, 24),
          new THREE.MeshStandardMaterial({ color:0xe6e6e6, emissive:0x222222, roughness:0.9 })
        );
        moon.position.x = p.size + 1.8;
        moonPivot.add(moon);
        mesh.add(moonPivot);
        p._moonPivot = moonPivot;
      }

      // Orbit ring
      const seg = 128, ov = new Float32Array((seg+1)*3);
      for (let i=0;i<=seg;i++){ const a=(i/seg)*Math.PI*2; ov[i*3]=Math.cos(a)*p.dist; ov[i*3+1]=0; ov[i*3+2]=Math.sin(a)*p.dist; }
      const og = new THREE.BufferGeometry(); og.setAttribute("position", new THREE.BufferAttribute(ov,3));
      orbitGroup.add(new THREE.Line(og, new THREE.LineBasicMaterial({ color:0x3a4a6b, transparent:true, opacity:0.5 })));

      p._pivot = pivot;
      p._mesh = mesh;
      p._angle = Math.random()*Math.PI*2;
    });

    // ---------- Legend ----------
    const legend = document.getElementById("legend");
    PLANETS.forEach((p) => {
      const b = document.createElement("button");
      const c = palAt(PALETTES[p.name] || [[200,200,210]], 0.7).map(v=>Math.round(v));
      b.innerHTML = `<span class="dot" style="color:rgb(${c[0]},${c[1]},${c[2]})"></span>${p.name}`;
      b.onclick = () => focusPlanet(p._mesh);
      legend.appendChild(b);
    });

    // ---------- Interaction: hover + click ----------
    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hovered = null;

    window.addEventListener("pointermove", (e) => {
      mouse.x = (e.clientX/window.innerWidth)*2 - 1;
      mouse.y = -(e.clientY/window.innerHeight)*2 + 1;
      ray.setFromCamera(mouse, camera);
      const hit = ray.intersectObjects(planetMeshes)[0];
      hovered = hit ? hit.object : null;
      if (hovered) {
        labelEl.textContent = hovered.userData.name;
        labelEl.style.left = e.clientX + "px";
        labelEl.style.top = e.clientY + "px";
        labelEl.style.opacity = 1;
        canvas.style.cursor = "pointer";
      } else {
        labelEl.style.opacity = 0;
        canvas.style.cursor = "grab";
      }
    });

    let followTarget = null;
    window.addEventListener("click", () => { if (hovered) focusPlanet(hovered); });

    function focusPlanet(mesh) {
      followTarget = mesh;
    }

    // ---------- Controls UI ----------
    let showOrbits = true, paused = false;
    document.getElementById("toggle-orbits").onclick = (e) => {
      showOrbits = !showOrbits; orbitGroup.visible = showOrbits;
      e.target.textContent = showOrbits ? "Hide orbits" : "Show orbits";
    };
    document.getElementById("toggle-motion").onclick = (e) => {
      paused = !paused; e.target.textContent = paused ? "Play" : "Pause";
    };
    document.getElementById("reset-view").onclick = () => {
      followTarget = null; controls.target.set(0,0,0);
    };

    // ---------- Bloom post-processing (the modern glow) ----------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.9,   // strength
      0.5,   // radius
      0.15   // threshold
    );
    composer.addPass(bloom);

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const speed = (paused || reduced) ? 0 : dt;

      sun.rotation.y += speed*0.1;
      starField.rotation.y += speed*0.005;
      sunSkin.rotation.y -= speed*0.08;
      const pulse = 1 + Math.sin(clock.elapsedTime*1.5)*0.025;
      sunSkin.scale.setScalar(pulse);

      PLANETS.forEach((p) => {
        p._angle += speed * p.speed * 0.4;
        p._pivot.rotation.y = p._angle;
        p._mesh.rotation.y += speed * p.spin * 20;
        if (p._moonPivot) p._moonPivot.rotation.y += speed * 2;
      });

      if (followTarget) {
        const wp = new THREE.Vector3();
        followTarget.getWorldPosition(wp);
        controls.target.lerp(wp, 0.08);
        const desired = wp.clone().add(new THREE.Vector3(0, followTarget.userData.size*3+4, followTarget.userData.size*5+8));
        camera.position.lerp(desired, 0.04);
      }

      planetMeshes.forEach((m) => m.scale.setScalar(m === hovered ? 1.25 : 1 + (m.scale.x-1)*0.8));

      controls.update();
      composer.render();
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener("error", (e) => {
      document.body.insertAdjacentHTML("beforeend",
        `<div style="position:fixed;inset:0;display:grid;place-items:center;color:#93a0b8;font:14px Inter,sans-serif;text-align:center;padding:20px">3D failed to load:<br>${e.message}</div>`);
    });
  </script>
</body>
</html>
