---
layout: default
---

<!-- ============ SNEHA'S UNIVERSE ============ -->
<div id="universe">
    <canvas id="universe-canvas"></canvas>
</div>
<div id="warp-cover"></div>

<div class="uni-overlay uni-title">
    <h1>Sneha's <span class="grad">Universe</span></h1>
    <p>Drag to orbit · scroll to zoom · click a planet to explore</p>
</div>

<div class="uni-overlay uni-nav" id="uni-nav"></div>
<div class="uni-overlay uni-hint">pick a world</div>
<div id="uni-label"></div>

<!-- ============ PLANET CONTENT PANEL ============ -->
<div id="planet-panel">
    <div class="panel-topbar">
        <button class="panel-back" id="panel-back">← Back to universe</button>
        <div class="panel-title">
            <span class="kick" id="panel-kick"></span>
            <h2 id="panel-heading"></h2>
        </div>
    </div>
    <div class="panel-body" id="panel-body"></div>
</div>

<!-- ============ Blog feed template (injected into the Blog planet) ============ -->
<template id="tpl-blog">
    <div class="filter-bar">
        <button class="active" data-cat="All">All</button>
        <button data-cat="Essays">Essays</button>
        <button data-cat="Travel">Travel</button>
        <button data-cat="Science">Science</button>
        <button data-cat="Paintings">Paintings</button>
        <button data-cat="Blogs">Blogs</button>
        <button data-cat="Technology">Technology</button>
    </div>
    <div id="feed">
        {% for post in site.posts %}
        {% if post.category == 'Blog' %}
        <article class="post-preview reveal {{ post.type }}" data-cat="{{ post.type }}">
            <a href="{{ post.url | prepend: site.baseurl | replace: '//', '/' }}">
                <h2 class="post-title">{{ post.title }}</h2>
                {% if post.subtitle %}
                <h3 class="post-subtitle">{{ post.subtitle }}</h3>
                {% else %}
                <h3 class="post-subtitle">{{ post.excerpt | strip_html | truncatewords: 15 }}</h3>
                {% endif %}
            </a>
            <p class="post-meta">
                Posted by {% if post.author %}{{ post.author }}{% else %}{{ site.author }}{% endif %}
                on {{ post.date | date: '%B %d, %Y' }}
                &middot; {% include read_time.html content=post.content %}
            </p>
        </article>
        {% endif %}
        {% endfor %}
    </div>
    <div id="panel-sentinel"></div>
    <div style="text-align:right; margin-top:14px;">
        <a class="btn btn-primary" href="{{ "/posts" | relative_url }}">View All Posts</a>
    </div>
</template>

<!-- ============ 3D deps ============ -->
<script>window.SITE_BASEURL = "{{ site.baseurl }}";</script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="{{ "/assets/universe.js" | relative_url }}"></script>
